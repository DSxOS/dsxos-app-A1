# a1.yaml - peak-shaving correction of a long-term ESS plan (A1-IMP). See README.md for all params and defaults.
---
appModule: a1
type: python
containerName: a1                                   # has to be lowercase
cron: "40 */15 * * * *"                             # 6-field cron: ~30 s after the app that writes the long-term plan
logLevel: 4
params:
  apiEndpoint: "http://localhost:8080/api"
  clientId: "your-client-id"                        # API credential: client ID ...
  token: "your-client-secret"                       # ... and its secret (generated by the site owner)
  consumptionPrognosisIdentifier: "consumption_p"   # load forecast [W]
  productionPrognosisIdentifier: "production_p"     # PV forecast [W], negative = generation
  essCurrentPowerPlanIdentifier: "ess_p_a5"         # long-term plan to correct [W] (e.g. A5's result)
  essResultPowerPlanIdentifier: "ess_p_a1"          # receives the corrected plan [W], positive = charging
  ess_max_P_charge_dp_id: "ess_max_P_charge"        # charge power limit [W], positive: datapoint id or number
  ess_max_P_discharge_dp_id: "ess_max_P_discharge"  # discharge power limit [W], positive: datapoint id or number
  ess_max_E_dp_id: "ess_max_E"                      # ESS capacity [Wh]: datapoint id or number (e.g. 284000)
  essEffectiveCharge: "ess_charge"                  # total stored energy now [Wh]
  ess_min_soc: 15                                   # SoC window [%]: datapoint id or number
  ess_max_soc: 90
  pccImportLimitW: 50000                            # upper limit of the net PCC power [W], import positive (soft): datapoint id or number
  pccExportLimitW: -1000000                         # lower limit of the net PCC power [W], signed (soft): negative = export allowed,
                                                    # 0 = no export, positive = minimum import. Datapoint id or number
  interval: 60                                      # time step [s]
  min_period: 21600                                 # minimum common horizon [s]
  # essChargeEfficiency: 0.95
  # essDischargeEfficiency: 0.95
  # pccLimitPenaltyPerKWh: 1000
